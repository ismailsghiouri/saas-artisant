server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA (React Router) : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html référence les fichiers hashés (assets/index-XXXX.js) : il ne
    # doit JAMAIS être mis en cache, sinon un navigateur peut continuer à
    # servir une version qui pointe vers un ancien bundle après un déploiement,
    # même si les nouveaux fichiers sont bien présents sur le serveur.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Logos/favicons : fichiers non hashés, remplacés en place lors d'une mise
    # à jour de branding — ne jamais les mettre en cache long terme, sinon le
    # navigateur (et nginx) continuent de servir l'ancienne image indéfiniment.
    location ~* ^/(favicon-32\.png|apple-touch-icon\.png|new-logo\.png|logo\.png|logo-mark\.png)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Assets buildés par Vite (hashés dans le nom de fichier) : cache long terme sûr.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
